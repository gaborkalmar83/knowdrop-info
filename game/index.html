    <script>
      // Apply the saved theme before the first paint (no flash).
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('kd.settings') || '{}');
          var t = s.theme === 'light' || s.theme === 'dark' ? s.theme : '';
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
